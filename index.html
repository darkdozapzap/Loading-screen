<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loading Screen</title>
    <style>
        * {
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            outline: none !important;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Tahoma, Geneva, Verdana, sans-serif;
        }

        .header-container {
            position: relative;
            margin-bottom: 30px !important;
            text-align: center;
        }

        .server-title {
            color: #111111;
            font-size: 38px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
        }

        .splash-text {
            position: absolute;
            right: -10px;
            bottom: -40px;
            color: #FFFF55;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #3f3f00, 2px 2px 4px rgba(0, 0, 0, 0.7); 
            white-space: nowrap;
            pointer-events: none;
            animation: splashBounce 0.4s infinite alternate ease-in-out;
            z-index: 20;
        }

        @keyframes splashBounce {
            0% { transform: rotate(-15deg) scale(1); }
            100% { transform: rotate(-15deg) scale(1.15); }
        }

        /* --- CONTAINER DA TV --- */
        .tv-container {
            position: relative;
            max-width: 90vw;
            max-height: 65vh;
            display: inline-block;
        }

        .loading-gif {
            width: auto;
            height: 100%;
            max-height: 65vh;
            display: block;
        }

        /* --- ESTILO DO AVATAR NA TV --- */
        .avatar-img {
            position: absolute;
            display: none; /* Aparece via JS quando carregar */
            
            /* Ajuste estes valores para posicionar dentro do espaço amarelo */
            top: 13%;       
            left: 42%;      
            width: 6.4%;      
            height: 16.0%;    
            
/* TRUQUE GMOD: Usamos Skew (inclinação 2D) para simular o 3D (perspective) sem bugar o jogo */
            transform: rotate(4deg) skewY(10.2deg) skewX(-2deg);
            
            border-radius: 2px;
            object-fit: cover;
            z-index: 10;
            
            /* TRUQUE DA TELA: Como inset shadow não pega em <img>, 
               usamos drop-shadow externo pequeno e escurecemos a imagem levemente */
            box-shadow: 0 0 5px rgba(0,0,0,0.8);
            filter: brightness(0.85) contrast(1.1);
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="server-title">Servidor Supimpa de Garry's mod</h1>
        <span id="splash" class="splash-text">Carregando...</span>
    </div>

    <!-- Caixa que segura o GIF e a tela da TV juntos -->
    <div class="tv-container">
        <img class="loading-gif" src="loading.gif" alt="Carregando...">
        <img id="player-avatar" class="avatar-img" src="" alt="Avatar">
    </div>

    <script>
        const splashes = [
            "100% livre de bugs!*",
            "Supimpa demais!",
            "Cuidado com o Prop Push!",
            "Feito com HTML & CSS!",
            "Não aperte Alt + F4!",
            "Servidor rodando liso!",
            "Invocando os addons...",
            "Tudo sob controle!",
            "Bem-vindo ao servidor!"
        ];

        const randomSplash = splashes[Math.floor(Math.random() * splashes.length)];
        document.getElementById("splash").innerText = randomSplash;

        // --- INSIRA AQUI A URL DO SEU CLOUDFLARE WORKER ---
        const PROXY_URL = "https://steamprofileget.felipe-souza-2019-83.workers.dev/?steamid="; 

        const urlParams = new URLSearchParams(window.location.search);
        const steamId = urlParams.get('steamid');

        if (steamId) {
            fetch(`${PROXY_URL}?steamid=${steamId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Erro na requisição: ' + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    if (data && data.avatarfull) {
                        const avatarElement = document.getElementById("player-avatar");
                        avatarElement.src = data.avatarfull;
                        avatarElement.style.display = "block"; 
                    }
                })
                .catch(error => {
                    console.error("Não foi possível carregar o avatar do jogador:", error);
                });
        }
    </script>
</body>
</html>
