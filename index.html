<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loading Screen</title>
    <style>
        * {
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            outline: none !important;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Tahoma, Geneva, Verdana, sans-serif;
        }

        .header-container {
            position: relative;
            margin-bottom: 30px !important;
            text-align: center;
        }

        .server-title {
            color: #111111;
            font-size: 38px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
        }

        .splash-text {
            position: absolute;
            right: -10px;
            bottom: -40px;
            color: #FFFF55;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #3f3f00, 2px 2px 4px rgba(0, 0, 0, 0.7); 
            white-space: nowrap;
            pointer-events: none;
            animation: splashBounce 0.4s infinite alternate ease-in-out;
        }

        @keyframes splashBounce {
            0% { transform: rotate(-15deg) scale(1); }
            100% { transform: rotate(-15deg) scale(1.15); }
        }

        /* Container relativo para prender a foto sobre a TV */
        .stage-container {
            position: relative;
            display: inline-block;
            max-width: 90vw;
            max-height: 65vh;
        }

        .stage-container img.bg-gif {
            width: 100%;
            height: auto;
            max-height: 65vh;
            display: block;
            object-fit: contain;
        }

        /* Foto da Steam posicionada sobre a TV no GIF */
        .tv-avatar {
            position: absolute;
            
            /* Posição aproximada da tela da TV (Ajuste se necessário) */
            top: 13.5%;
            left: 36.8%;
            width: 7.2%;
            height: 10.5%;
            
            object-fit: cover;
            border-radius: 2px;
            opacity: 0.85; /* Efeito leve de tela CRT */

            /* Inclinação para alinhar com a perspectiva da TV */
            transform: rotate(-11deg) skewY(4deg);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="server-title">Servidor Supimpa de Garry's mod</h1>
        <span id="splash" class="splash-text">Carregando...</span>
    </div>

    <div class="stage-container">
        <img src="loading.gif" alt="Carregando..." class="bg-gif">
        <!-- Imagem de perfil que será carregada via JS (Foto padrão de interrogação se falhar) -->
        <img id="user-avatar" class="tv-avatar" src="https://avatars.steamstatic.com/fef49e7fa7e1997310d705b2a6158ff8dc1cdfeb_full.jpg" alt="Steam Avatar">
    </div>

    <script>
        // 1. Splash text aleatório
        const splashes = [
            "100% livre de bugs!*",
            "Supimpa demais!",
            "Cuidado com o Prop Push!",
            "Feito com HTML & CSS!",
            "Não aperte Alt + F4!",
            "Servidor rodando liso!",
            "Invocando os addons...",
            "Tudo sob controle!",
            "Bem-vindo ao servidor!"
        ];
        document.getElementById("splash").innerText = splashes[Math.floor(Math.random() * splashes.length)];

        // 2. Busca da Foto de Perfil da Steam
        const urlParams = new URLSearchParams(window.location.search);
        const steamid = urlParams.get('steamid');

        if (steamid) {
            // Puxa o perfil público da Steam em XML via proxy CORS
            fetch(`https://corsproxy.io/?https://steamcommunity.com/profiles/${steamid}/?xml=1`)
                .then(response => response.text())
                .then(str => new DOMParser().parseFromString(str, "text/xml"))
                .then(data => {
                    const avatarUrl = data.querySelector("avatarFull")?.textContent || data.querySelector("avatarIcon")?.textContent;
                    if (avatarUrl) {
                        document.getElementById("user-avatar").src = avatarUrl;
                    }
                })
                .catch(err => console.log("Erro ao carregar avatar Steam:", err));
        }
    </script>

</body>
</html>
