<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loading Screen</title>
    <style>
        * {
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            outline: none !important;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff; 
            overflow: hidden;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            font-family: Tahoma, Geneva, Verdana, sans-serif; /* Fonte Tahoma aplicada */
        }

        .server-title {
            color: #cccaca; /* Cor do texto (Branco) */
            font-size: 36px; /* Tamanho da fonte */
            font-weight: bold;
            margin-bottom: 24px !important; /* Espaço entre o título e o GIF */
            text-align: center;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.2); /* Suave brilho no texto */
        }

        img {
            max-width: 90vw;
            max-height: 70vh; /* Garante espaço para o título sem estourar a tela */
            width: auto;
            height: auto;
            display: block;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <h1 class="server-title">Servidor Supimpa de Garry's mod</h1>
    <img src="loading.gif" alt="Carregando...">

</body>
</html>
