<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loading Screen</title>
    <style>
        * {
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            outline: none !important;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Tahoma, Geneva, Verdana, sans-serif;
        }

        .header-container {
            position: relative;
            margin-bottom: 30px !important;
            text-align: center;
        }

        .server-title {
            color: #111111;
            font-size: 38px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
        }

        .splash-text {
            position: absolute;
            right: -10px;
            bottom: -40px;
            color: #FFFF55;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #3f3f00, 2px 2px 4px rgba(0, 0, 0, 0.7); 
            white-space: nowrap;
            pointer-events: none;
            animation: splashBounce 0.4s infinite alternate ease-in-out;
        }

        @keyframes splashBounce {
            0% {
                transform: rotate(-15deg) scale(1);
            }
            100% {
                transform: rotate(-15deg) scale(1.15);
            }
        }

        #avatarJogador {
            max-width: none !important;
            max-height: none !important;
            width: 128px !important;
            height: 128px !important;
            border-radius: 50% !important;
            border: 4px solid #111111 !important;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3) !important;
            margin-bottom: 20px !important;
            object-fit: cover;
        }

        #loading-gif {
            max-width: 90vw;
            max-height: 65vh;
            width: auto;
            height: auto;
            display: block;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="server-title">Servidor Supimpa de Garry's mod</h1>
        <span id="splash" class="splash-text">Carregando...</span>
    </div>

    <!-- Imagem de perfil do jogador -->
    <img id="avatarJogador" src="https://i.imgur.com/2m4cT3y.png" alt="Avatar do Jogador">

    <img id="loading-gif" src="loading.gif" alt="Carregando...">

    <script>
        var splashes = [
            "100% livre de bugs!*",
            "Supimpa demais!",
            "Cuidado com o Prop Push!",
            "Feito com HTML & CSS!",
            "Não aperte Alt + F4!",
            "Servidor rodando liso!",
            "Invocando os addons...",
            "Tudo sob controle!",
            "Bem-vindo ao servidor!"
        ];

        var randomSplash = splashes[Math.floor(Math.random() * splashes.length)];
        document.getElementById("splash").innerText = randomSplash;

        // Atualiza a imagem diretamente sem precisar de requisições externas de texto
        function definirAvatar(steamid) {
            if (steamid && steamid !== "%s" && steamid.length > 5) {
                // unavatar.io redireciona diretamente para a foto do perfil na Steam
                document.getElementById("avatarJogador").src = "https://unavatar.io/steam/" + steamid;
            }
        }

        // 1. Tenta capturar o ID se ele for passado na URL (?steamid=765611...)
        var match = window.location.search.match(/[?&]steamid=([^&]+)/);
        if (match && match[1]) {
            definirAvatar(match[1]);
        }

        // 2. Tenta capturar se o Garry's Mod chamar a função nativa GameDetails
        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language) {
            definirAvatar(steamid);
        }
    </script>

</body>
</html>
