<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loading Screen</title>
    <style>
        * {
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            outline: none !important;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Tahoma, Geneva, Verdana, sans-serif;
        }

        .header-container {
            position: relative;
            margin-bottom: 50px !important;
            text-align: center;
            z-index: 10;
        }

        .server-title {
            color: #111111;
            font-size: 38px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
        }

        .splash-text {
            position: absolute;
            right: -20px;
            bottom: -35px;
            color: #FFFF55;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #3f3f00, 2px 2px 4px rgba(0, 0, 0, 0.7); 
            white-space: nowrap;
            pointer-events: none;
            animation: splashBounce 0.4s infinite alternate ease-in-out;
            z-index: 20;
        }

        @keyframes splashBounce {
            0% { transform: rotate(-15deg) scale(1); }
            100% { transform: rotate(-15deg) scale(1.15); }
        }

        /* Container ajustado para "abraçar" o GIF exatament e não bugar a posição */
        .stage-container {
            position: relative;
            display: inline-block;
            z-index: 1;
        }

        .stage-container img.bg-gif {
            height: 65vh; /* Define a altura, a largura se adapta automaticamente */
            width: auto;
            display: block;
        }

        /* Foto da Steam exata no quadrado vermelho */
        .tv-avatar {
            position: absolute;
            
            /* Coordenadas atualizadas com base no quadrado vermelho */
            top: 10.5%;
            left: 29.5%;
            width: 7.5%;
            height: 11.5%;
            
            object-fit: cover;
            border-radius: 2px;
            opacity: 0.85; /* Efeito leve de opacidade para misturar na tela */
            
            /* Rotação positiva porque a TV está inclinada para baixo na direita */
            transform: rotate(8deg);
            
            box-shadow: inset 0 0 8px rgba(0,0,0,0.9); /* Sombra interna para parecer que está dentro do monitor */
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="server-title">Servidor Supimpa de Garry's mod</h1>
        <span id="splash" class="splash-text">Carregando...</span>
    </div>

    <!-- O Container agora abraça o GIF perfeitamente -->
    <div class="stage-container">
        <img src="loading.gif" alt="Cenário" class="bg-gif">
        <!-- Ponto de interrogação padrão se falhar -->
        <img id="user-avatar" class="tv-avatar" src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Solid_gray.png/1024px-Solid_gray.png" alt="Avatar">
    </div>

    <script>
        // 1. Splash Text Aleatório
        const splashes = [
            "100% livre de bugs!*",
            "Supimpa demais!",
            "Cuidado com o Prop Push!",
            "Feito com HTML & CSS!",
            "Não aperte Alt + F4!",
            "Servidor rodando liso!",
            "Invocando os addons...",
            "Tudo sob controle!",
            "Bem-vindo ao servidor!"
        ];
        document.getElementById("splash").innerText = splashes[Math.floor(Math.random() * splashes.length)];

        // 2. Busca Rápida e Confiável da Foto da Steam (DecAPI)
        const urlParams = new URLSearchParams(window.location.search);
        const steamid = urlParams.get('steamid');

        if (steamid) {
            // DecAPI converte o SteamID64 direto na URL do .jpg sem problemas de CORS
            fetch(`https://decapi.me/steam/avatar/${steamid}`)
                .then(res => res.text())
                .then(avatarUrl => {
                    // Verifica se o retorno é realmente um link http
                    if (avatarUrl && avatarUrl.startsWith("http")) {
                        document.getElementById("user-avatar").src = avatarUrl;
                    }
                })
                .catch(err => console.error("Erro na API da Steam:", err));
        }
    </script>

</body>
</html>
