<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loading Screen</title>
    <style>
    
        * {
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            outline: none !important;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #FFFFFF;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            display: block;
            object-fit: contain; /* Mantém a proporção do GIF sem esticar */
        }
    </style>
</head>
<body>

    <img src="loading.gif" alt="Carregando...">

</body>
</html>
