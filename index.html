<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loading Screen</title>
    <style>
        * {
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            outline: none !important;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff; /* Fundo branco */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Container para alinhar o Splash Text em relação ao Título */
        .header-container {
            position: relative;
            margin-bottom: 30px !important;
            text-align: center;
        }

        .server-title {
            color: #111111;
            font-size: 38px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
        }

        /* Estilo Splash Text do Minecraft */
        .splash-text {
            position: absolute;
            right: -10px;
            bottom: -40px;
            color: #FFFF55; /* Amarelo vibrante clássico */
            font-size: 26px;
            font-weight: bold;
            /* Sombra escura e contorno para dar contraste no fundo branco */
            text-shadow: 2px 2px 0px #3f3f00, 2px 2px 4px rgba(0, 0, 0, 0.7); 
            white-space: nowrap;
            pointer-events: none;
            
            /* Animação de pulsação */
            animation: splashBounce 0.4s infinite alternate ease-in-out;
        }

        /* Animação que faz o texto pulsar no ângulo de -15 graus */
        @keyframes splashBounce {
            0% {
                transform: rotate(-15deg) scale(1);
            }
            100% {
                transform: rotate(-15deg) scale(1.15);
            }
        }

        /* Estilos do Avatar do jogador */
        #avatarJogador {
            max-width: none !important;
            max-height: none !important;
            width: 128px !important;
            height: 128px !important;
            border-radius: 50% !important;
            border: 4px solid #111111 !important;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3) !important;
            margin-bottom: 20px !important;
            object-fit: cover;
        }

        /* Aplica as dimensões apenas na imagem de carregamento para não bugar o avatar */
        #loading-gif {
            max-width: 90vw;
            max-height: 65vh;
            width: auto;
            height: auto;
            display: block;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="server-title">Servidor Supimpa de Garry's mod</h1>
        <span id="splash" class="splash-text">Carregando...</span>
    </div>

    <!-- Área da foto de perfil (Inicia com uma imagem de interrogação padrão) -->
    <img id="avatarJogador" src="https://i.imgur.com/2m4cT3y.png" alt="Avatar do Jogador">

    <!-- Adicionei o ID 'loading-gif' aqui para diferenciar do avatar -->
    <img id="loading-gif" src="loading.gif" alt="Carregando...">

    <script>
        // Adicione ou edite as frases que você quer que apareçam aleatoriamente
        const splashes = [
            "100% livre de bugs!*",
            "Supimpa demais!",
            "Cuidado com o Prop Push!",
            "Feito com HTML & CSS!",
            "Não aperte Alt + F4!",
            "Servidor rodando liso!",
            "Invocando os addons...",
            "Tudo sob controle!",
            "Bem-vindo ao servidor!"
        ];

        // Sorteia uma frase da lista ao abrir a página
        const randomSplash = splashes[Math.floor(Math.random() * splashes.length)];
        document.getElementById("splash").innerText = randomSplash;

        // O GMod chama essa função automaticamente quando o jogador conecta no servidor
        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language) {
            if (steamid) {
                // Como está no GitHub, usamos a API do DecAPI para pegar a foto sem bloqueio (CORS)
                fetch(`https://decapi.me/steam/avatar/${steamid}`)
                    .then(response => response.text())
                    .then(avatarUrl => {
                        // Confere se retornou um link válido da imagem
                        if (avatarUrl && avatarUrl.startsWith("http")) {
                            document.getElementById("avatarJogador").src = avatarUrl;
                        }
                    })
                    .catch(err => console.error("Erro ao buscar avatar na Steam:", err));
            }
        }
    </script>

</body>
</html>
