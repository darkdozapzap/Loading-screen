<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loading Screen</title>
    <style>
        * { margin: 0 !important; padding: 0 !important; border: none !important; outline: none !important; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background-color: #ffffff; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: Tahoma, Geneva, Verdana, sans-serif; }
        .header-container { position: relative; margin-bottom: 30px !important; text-align: center; }
        .server-title { color: #111111; font-size: 38px; font-weight: bold; letter-spacing: 1px; text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3); }
        .splash-text { position: absolute; right: -10px; bottom: -40px; color: #FFFF55; font-size: 26px; font-weight: bold; text-shadow: 2px 2px 0px #3f3f00, 2px 2px 4px rgba(0, 0, 0, 0.7); white-space: nowrap; pointer-events: none; animation: splashBounce 0.4s infinite alternate ease-in-out; }
        @keyframes splashBounce { 0% { transform: rotate(-15deg) scale(1); } 100% { transform: rotate(-15deg) scale(1.15); } }
        #avatarJogador { max-width: none !important; max-height: none !important; width: 128px !important; height: 128px !important; border-radius: 50% !important; border: 4px solid #111111 !important; box-shadow: 0px 4px 10px rgba(0,0,0,0.3) !important; margin-bottom: 20px !important; object-fit: cover; }
        #loading-gif { max-width: 90vw; max-height: 65vh; width: auto; height: auto; display: block; object-fit: contain; }
        #debug-box { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); color: #fff; padding: 10px; font-family: monospace; border-radius: 5px; z-index: 9999; font-size: 14px; }
    </style>
</head>
<body>

    <div id="debug-box">Debug: Aguardando resposta do GMod...</div>

    <div class="header-container">
        <h1 class="server-title">Servidor Supimpa de Garry's mod</h1>
        <span id="splash" class="splash-text">Carregando...</span>
    </div>

    <img id="avatarJogador" src="https://i.imgur.com/2m4cT3y.png" alt="Avatar do Jogador">
    <img id="loading-gif" src="loading.gif" alt="Carregando...">

    <script>
        var splashes = ["100% livre de bugs!*", "Supimpa demais!", "Cuidado com o Prop Push!", "Bem-vindo ao servidor!"];
        document.getElementById("splash").innerText = splashes[Math.floor(Math.random() * splashes.length)];

        function buscarEExibirAvatar(steamid, origem) {
            var debugBox = document.getElementById("debug-box");
            if (!steamid || steamid === "%s") {
                debugBox.innerText = "Debug (" + origem + "): ID invalido ou %s.";
                return;
            }

            debugBox.innerText = "Debug (" + origem + "): Buscando link direto...";

            var xhr = new XMLHttpRequest();
            xhr.open("GET", "https://decapi.me/steam/avatar/" + steamid, true);

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        var directUrl = xhr.responseText.trim();
                        if (directUrl && directUrl.indexOf("http") === 0) {
                            
                            // A MÁGICA ACONTECE AQUI:
                            // Troca o https:// por http:// para o navegador do GMod não bloquear a imagem
                            directUrl = directUrl.replace("https://", "http://");
                            
                            document.getElementById("avatarJogador").src = directUrl;
                            debugBox.innerText = "Debug (" + origem + "): Sucesso! Forçando HTTP...";
                        } else {
                            debugBox.innerText = "Debug (" + origem + "): Resposta invalida da API.";
                        }
                    } else {
                        debugBox.innerText = "Debug (" + origem + "): Falha na API (Status " + xhr.status + ").";
                    }
                }
            };

            xhr.send();
        }

        // Leitura via URL (?steamid=7656...)
        var match = window.location.search.match(/[?&]steamid=([^&]+)/);
        if (match && match[1]) {
            buscarEExibirAvatar(match[1], "URL");
        }

        // Leitura via função nativa do GMod
        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language) {
            buscarEExibirAvatar(steamid, "GameDetails");
        }
    </script>
