<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loading Screen</title>
    <style>
        * {
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            outline: none !important;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Container do Título + Splash Text */
        .header-container {
            position: relative;
            margin-bottom: 50px !important; /* Espaço ampliado para não colidir com o GIF */
            text-align: center;
            z-index: 10; /* Mantém o cabeçalho acima do GIF */
        }

        .server-title {
            color: #111111;
            font-size: 38px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
        }

        /* Splash Text do Minecraft ajustado */
        .splash-text {
            position: absolute;
            right: -20px;
            bottom: -35px;
            color: #FFFF55;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #3f3f00, 2px 2px 4px rgba(0, 0, 0, 0.7); 
            white-space: nowrap;
            pointer-events: none;
            animation: splashBounce 0.4s infinite alternate ease-in-out;
            z-index: 20; /* Força o Splash Text a ficar NA FRENTE de qualquer elemento */
        }

        @keyframes splashBounce {
            0% { transform: rotate(-15deg) scale(1); }
            100% { transform: rotate(-15deg) scale(1.15); }
        }

        /* Container do GIF e da TV */
        .stage-container {
            position: relative;
            display: inline-block;
            max-width: 90vw;
            max-height: 65vh;
            z-index: 1;
        }

        .stage-container img.bg-gif {
            width: 100%;
            height: auto;
            max-height: 65vh;
            display: block;
            object-fit: contain;
        }

        /* Foto da Steam posicionada sobre a TV */
        .tv-avatar {
            position: absolute;
            
            /* Posição ajustada para a tela da TV */
            top: 15%;
            left: 36.5%;
            width: 6.8%;
            height: 9.8%;
            
            object-fit: cover;
            border-radius: 2px;
            opacity: 0.85;
            transform: rotate(-11deg) skewY(4deg);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="server-title">Servidor Supimpa de Garry's mod</h1>
        <span id="splash" class="splash-text">Carregando...</span>
    </div>

    <div class="stage-container">
        <img src="loading.gif" alt="Carregando..." class="bg-gif">
        <img id="user-avatar" class="tv-avatar" src="https://avatars.steamstatic.com/fef49e7fa7e1997310d705b2a6158ff8dc1cdfeb_full.jpg" alt="Steam Avatar">
    </div>

    <script>
        // 1. Splash Text Aleatório
        const splashes = [
            "100% livre de bugs!*",
            "Supimpa demais!",
            "Cuidado com o Prop Push!",
            "Feito com HTML & CSS!",
            "Não aperte Alt + F4!",
            "Servidor rodando liso!",
            "Invocando os addons...",
            "Tudo sob controle!",
            "Bem-vindo ao servidor!"
        ];
        document.getElementById("splash").innerText = splashes[Math.floor(Math.random() * splashes.length)];

        // 2. Busca Robusta da Foto da Steam
        const urlParams = new URLSearchParams(window.location.search);
        const steamid = urlParams.get('steamid');

        if (steamid) {
            // Tenta o Proxy 1 (AllOrigins)
            fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(`https://steamcommunity.com/profiles/${steamid}/?xml=1`)}`)
                .then(res => {
                    if (!res.ok) throw new Error();
                    return res.text();
                })
                .then(str => new DOMParser().parseFromString(str, "text/xml"))
                .then(data => {
                    const avatarUrl = data.querySelector("avatarFull")?.textContent || data.querySelector("avatarIcon")?.textContent;
                    if (avatarUrl && avatarUrl.startsWith("http")) {
                        document.getElementById("user-avatar").src = avatarUrl;
                    }
                })
                .catch(() => {
                    // Se o Proxy 1 falhar, tenta o Proxy 2 (CorsProxy)
                    fetch(`https://corsproxy.io/?https://steamcommunity.com/profiles/${steamid}/?xml=1`)
                        .then(res => res.text())
                        .then(str => new DOMParser().parseFromString(str, "text/xml"))
                        .then(data => {
                            const avatarUrl = data.querySelector("avatarFull")?.textContent;
                            if (avatarUrl) document.getElementById("user-avatar").src = avatarUrl;
                        });
                });
        }
    </script>

</body>
</html>
