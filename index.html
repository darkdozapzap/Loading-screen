<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Carregamento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        .loading-gif {
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Faz o GIF cobrir a tela inteira cortando sobras */
            object-position: center;
        }
    </style>
</head>
<body>

    <img src="loading.gif" alt="Carregando..." class="loading-gif">

</body>
</html>
