<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loading Screen</title>
    <style>
        * {
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            outline: none !important;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Tahoma, Geneva, Verdana, sans-serif;
        }

        .header-container {
            position: relative;
            margin-bottom: 30px !important;
            text-align: center;
        }

        .server-title {
            color: #111111;
            font-size: 38px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
        }

        .splash-text {
            position: absolute;
            right: -10px;
            bottom: -40px;
            color: #FFFF55;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #3f3f00, 2px 2px 4px rgba(0, 0, 0, 0.7); 
            white-space: nowrap;
            pointer-events: none;
            animation: splashBounce 0.4s infinite alternate ease-in-out;
        }

        @keyframes splashBounce {
            0% { transform: rotate(-15deg) scale(1); }
            100% { transform: rotate(-15deg) scale(1.15); }
        }

        /* GIF de carregamento */
        .loading-gif {
            max-width: 90vw;
            max-height: 40vh; /* Reduzido para dar espaço ao avatar */
            width: auto;
            height: auto;
            display: block;
            object-fit: contain;
            margin-bottom: 20px !important;
        }

        /* Estilos do Avatar do Jogador */
        .player-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px !important;
        }

        .avatar-img {
            width: 120px;
            height: 120px;
            border-radius: 50%; /* Deixa a imagem redonda */
            border: 4px solid #111111;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: none; /* Escondido por padrão, aparece quando carrega */
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="server-title">Servidor Supimpa de Garry's mod</h1>
        <span id="splash" class="splash-text">Carregando...</span>
    </div>

    <!-- GIF de Carregamento Original -->
    <img class="loading-gif" src="loading.gif" alt="Carregando...">

    <!-- Espaço onde o Avatar do jogador vai aparecer -->
    <div class="player-info">
        <img id="player-avatar" class="avatar-img" src="" alt="Avatar">
    </div>

    <script>
        // --- 1. Lógica do Splash Text (Frases Aleatórias) ---
        const splashes = [
            "100% livre de bugs!*",
            "Supimpa demais!",
            "Cuidado com o Prop Push!",
            "Feito com HTML & CSS!",
            "Não aperte Alt + F4!",
            "Servidor rodando liso!",
            "Invocando os addons...",
            "Tudo sob controle!",
            "Bem-vindo ao servidor!"
        ];

        const randomSplash = splashes[Math.floor(Math.random() * splashes.length)];
        document.getElementById("splash").innerText = randomSplash;

        // --- 2. Lógica para buscar o Avatar usando o Proxy ---
        
        // Coloque aqui a URL do seu Worker (Proxy)
        const PROXY_URL = "https://steamprofileget.felipe-souza-2019-83.workers.dev/?steamid="; 

        // O Garry's Mod passa o steamid pela URL (ex: index.html?steamid=7656119...)
        const urlParams = new URLSearchParams(window.location.search);
        const steamId = urlParams.get('steamid');

        // Se houver um steamid na URL, faz a requisição para o Proxy
        if (steamId) {
            fetch(`${PROXY_URL}?steamid=${steamId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Erro na requisição: ' + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    // Se o proxy retornar o avatar com sucesso
                    if (data && data.avatarfull) {
                        const avatarElement = document.getElementById("player-avatar");
                        avatarElement.src = data.avatarfull;
                        avatarElement.style.display = "block"; // Mostra a imagem
                    }
                })
                .catch(error => {
                    console.error("Não foi possível carregar o avatar do jogador:", error);
                });
        }
    </script>

</body>
</html>
