<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Carregamento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #FFFFFF
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .loading-gif {
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain; /* Preserva a proporção original sem esticar e sem cortar */
        }
    </style>
</head>
<body>

    <img src="loading.gif" alt="Carregando..." class="loading-gif">

</body>
</html>
